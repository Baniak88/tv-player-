apply plugin: 'com.android.library'
android {
    namespace 'androidx.media3.decoder.ffmpeg'
    compileSdk 35
    defaultConfig { minSdk 21; consumerProguardFiles 'consumer-rules.pro' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.annotation:annotation:1.6.0'
    implementation 'androidx.media3:media3-decoder:1.5.1'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    compileOnly 'org.checkerframework:checker-qual:3.13.0'
}
tasks.named('preBuild').configure {
    doFirst {
        ['armeabi-v7a','arm64-v8a','x86','x86_64'].each { abi ->
            if (!file("src/main/jniLibs/$abi/libffmpegJNI.so").isFile()) {
                throw new GradleException('Missing audio decoder binaries. Run bash scripts/build-audio-codecs.sh first; do not ship a TV APK without its decoders.')
            }
        }
    }
}
