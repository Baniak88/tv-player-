plugins { id 'com.android.application' }
android {
    namespace 'pl.tvplayer'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'pl.tvplayer.preview'
        minSdk 26
        targetSdk 35
        versionCode 37
        versionName '0.9.20-android'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        preview {
            storeFile rootProject.file('signing/preview.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes { debug { signingConfig signingConfigs.preview } }
    // Android owns responsive screen/transport variants; all other code is shared read-only.
    sourceSets {
        main {
            manifest.srcFile file('src/main/AndroidManifest.xml')
            java.srcDirs = [file('src/main/java')]
            res.srcDirs = [rootProject.file('tv/src/main/res'), rootProject.file('app/src/main/res')]
        }
        androidTest {
            java.srcDirs += [rootProject.file('tv/src/androidTest/java'), rootProject.file('app/src/androidTestSeries/java')]
            assets.srcDirs += [rootProject.file('tv/src/androidTest/assets'), rootProject.file('app/src/androidTest/assets')]
        }
    }
    compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
def androidVariants = ['TvActivity','TvShelfView','MovieActivity','SeriesActivity','PlayerActivity','TvLiveInfoBar','PlaybackNetwork'].collect { "pl/tvplayer/${it}.java" }
def sharedOutput = file("$buildDir/generated/androidSharedJava")
def sharedSources = tasks.register('syncAndroidSharedSources', Sync) {
    from(rootProject.file('tv/src/main/java')) { exclude androidVariants }
    from(rootProject.file('app/src/main/java')) { exclude androidVariants }
    into sharedOutput
}
android.applicationVariants.all { variant -> variant.registerJavaGeneratingTask(sharedSources.get(), sharedOutput) }
dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation 'com.google.zxing:core:3.5.3'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
    implementation 'androidx.media3:media3-decoder:1.5.1'
    implementation 'org.jellyfin.media3:media3-ffmpeg-decoder:1.5.0+1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation 'com.squareup.okhttp3:okhttp-tls:4.12.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
