name: TV platforms
on:
  pull_request:
    paths: ['tv/**', 'samsung/**', 'app/src/main/**', 'settings.gradle', 'scripts/*tv*', 'scripts/*samsung*', '.github/workflows/television.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fire-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle :app:testDebugUnitTest :tv:lintDebug :tv:assembleDebug :tv:assembleDebugAndroidTest --no-daemon
      - name: Check signature and launcher
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose tv/build/outputs/apk/debug/tv-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging tv/build/outputs/apk/debug/tv-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: television-apk
          path: |
            tv/build/outputs/apk/debug/tv-debug.apk
            tv/build/outputs/apk/androidTest/debug/tv-debug-androidTest.apk
  fire-test:
    permissions: {contents: write}
    needs: fire-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: television-apk, path: apk}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 25
          arch: x86_64
          disable-animations: true
          ram-size: 2048M
          script: bash scripts/smoke-tv.sh
      - name: Save native TV previews
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64,json,pathlib
          for name in ['tv-home','tv-movies','tv-bouquet']:
              image=pathlib.Path('tv-smoke-output',name+'.png')
              if image.exists():
                  pathlib.Path('/tmp',name+'.json').write_text(json.dumps({'encoding':'base64','content':base64.b64encode(image.read_bytes()).decode()}))
          PY
          for name in tv-home tv-movies tv-bouquet; do
            if [ ! -f "/tmp/$name.json" ]; then continue; fi
            ref=$(gh api "repos/$GH_REPO/git/blobs" --input "/tmp/$name.json" --jq '.sha')
            echo "UI_PREVIEW $name $ref"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: television-test-report, path: tv-smoke-output/}
  samsung-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --prefix /tmp/tv-browser --no-save playwright@1.56.1
      - run: node samsung/tests/core.test.cjs
      - name: Check remote UI and AVPlay integration
        env:
          NODE_PATH: /tmp/tv-browser/node_modules
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: node samsung/tests/browser.cjs
      - run: python3 scripts/package-samsung.py
      - run: bash -n scripts/install-samsung.sh
      - uses: actions/upload-artifact@v4
        with:
          name: samsung-widget
          path: |
            dist/TV-Player-Samsung-0.9.0-unsigned.wgt
            TV-INSTALL.md
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: samsung-preview-report, path: tv-smoke-output/}
  publish-tv:
    needs: [fire-test, samsung-test]
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: television-apk, path: apk}
      - uses: actions/download-artifact@v4
        with: {name: samsung-widget, path: widget}
      - name: Publish TV packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          cp apk/debug/tv-debug.apk TV-Player-FireTV-0.9.0.apk
          gh release view v0.9.0-tv-preview >/dev/null 2>&1 || gh release create v0.9.0-tv-preview --target "$SOURCE_SHA" --prerelease --title "TV Player TV 0.9.0" --notes "Wersja TV z obsługą pilota. APK: Fire OS 6+ i Android TV 7.1+. Nie jest zgodny z Vega OS. Samsung Tizen: dołączony WGT jest niepodpisany. Przed instalacją wymaga certyfikatu Samsung z DUID telewizora; instrukcja w TV-INSTALL.md."
          gh api --method PATCH "repos/$GH_REPO/git/refs/tags/v0.9.0-tv-preview" -f sha="$SOURCE_SHA" -F force=false >/dev/null
          gh release upload v0.9.0-tv-preview TV-Player-FireTV-0.9.0.apk widget/dist/TV-Player-Samsung-0.9.0-unsigned.wgt widget/TV-INSTALL.md --clobber
