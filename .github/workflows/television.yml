name: TV platforms
on:
  pull_request:
    paths: ['tv/**', 'samsung/**', 'app/src/main/**', 'settings.gradle', 'scripts/*tv*', 'scripts/*samsung*', '.github/workflows/television.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fire-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle :app:testDebugUnitTest :tv:lintDebug :tv:assembleDebug :tv:assembleDebugAndroidTest --no-daemon
      - name: Check signature and launcher
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose tv/build/outputs/apk/debug/tv-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging tv/build/outputs/apk/debug/tv-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: television-apk
          path: |
            tv/build/outputs/apk/debug/tv-debug.apk
            tv/build/outputs/apk/androidTest/debug/tv-debug-androidTest.apk
  fire-test:
    needs: fire-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: television-apk, path: apk}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          disable-animations: true
          ram-size: 2048M
          script: bash scripts/smoke-tv.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: television-test-report, path: tv-smoke-output/}
  publish-fire:
    needs: fire-test
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: television-apk, path: apk}
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          cp apk/debug/tv-debug.apk TV-Player-FireTV-0.9.0.apk
          gh release view v0.9.0-tv-preview >/dev/null 2>&1 || gh release create v0.9.0-tv-preview --target "$SOURCE_SHA" --prerelease --title "TV Player TV 0.9.0" --notes "Wersja TV z obsługą pilota. APK: Fire OS 7+ i Android TV 8+. Nie jest zgodny z Vega OS. Samsung Tizen wymaga osobnej paczki WGT i certyfikatu urządzenia."
          gh api --method PATCH "repos/$GH_REPO/git/refs/tags/v0.9.0-tv-preview" -f sha="$SOURCE_SHA" -F force=false >/dev/null
          gh release upload v0.9.0-tv-preview TV-Player-FireTV-0.9.0.apk --clobber
