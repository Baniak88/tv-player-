name: Xiaomi TV Box
# Separate from "TV platforms" (Fire Stick): failures here never block Fire Stick builds, tests or releases.
on:
  push:
    branches: [main, 'feature/tv-*', 'fix/**']
    paths: ['tv/**', 'app/src/main/**', 'app/build.gradle', 'scripts/smoke-tv.sh', 'xiaomi/**', '.github/workflows/xiaomi.yml']
  pull_request:
    paths: ['tv/**', 'app/src/main/**', 'app/build.gradle', 'scripts/smoke-tv.sh', 'xiaomi/**', '.github/workflows/xiaomi.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  xiaomi-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle :tv:assembleDebug :tv:assembleDebugAndroidTest --no-daemon
      - name: Check signature and launcher
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose tv/build/outputs/apk/debug/tv-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging tv/build/outputs/apk/debug/tv-debug.apk | grep -E "leanback-launchable|targetSdkVersion"
      - name: Test and package Xiaomi installer
        run: |
          bash -n xiaomi/install-xiaomi.sh
          python3 -m unittest discover -s xiaomi/tests -v
          python3 xiaomi/package-xiaomi.py
      - uses: actions/upload-artifact@v4
        with: {name: xiaomi-bundle, path: dist/OKTV-Xiaomi-TV-Box.zip}
      - uses: actions/upload-artifact@v4
        with:
          name: xiaomi-apk
          path: |
            tv/build/outputs/apk/debug/tv-debug.apk
            tv/build/outputs/apk/androidTest/debug/tv-debug-androidTest.apk
  xiaomi-test:
    # Xiaomi TV Box S 3rd gen (MiTV-AFMU0) runs Google TV on Android 14: Android TV API 34 emulator.
    needs: xiaomi-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: xiaomi-apk, path: apk}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          disable-animations: true
          ram-size: 2048M
          script: bash scripts/smoke-tv.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: xiaomi-android14-test-report, path: tv-smoke-output/}
  publish-xiaomi:
    # Manual only; uses its own release tag so the Fire Stick release is never touched.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: xiaomi-test
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: xiaomi-apk, path: apk}
      - uses: actions/download-artifact@v4
        with: {name: xiaomi-bundle, path: bundle}
      - name: Publish Xiaomi packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cp apk/debug/tv-debug.apk OKTV-Player-Xiaomi-0.9.6-preview.apk
          gh release view v0.9.6-xiaomi-preview >/dev/null 2>&1 || gh release create v0.9.6-xiaomi-preview --target "$SOURCE_SHA" --prerelease --title "OKTV Player 0.9.6 Preview — Xiaomi TV Box S" --notes "Wersja dla Xiaomi TV Box S 3. gen (MiTV-AFMU0, Google TV / Android 14). Te same funkcje co na Fire Sticku. Instalacja z pendrive'a: skopiuj APK, zainstaluj menedżerem plików na boxie. Instalacja przez ADB: OKTV-Xiaomi-TV-Box.zip. Instrukcja w paczce (CZYTAJ-XIAOMI.md)."
          gh release upload --clobber v0.9.6-xiaomi-preview OKTV-Player-Xiaomi-0.9.6-preview.apk bundle/OKTV-Xiaomi-TV-Box.zip
