name: Android APK
on:
  push:
    branches: [main, feature/android-player, 'fix/android-**']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Keep original Fire Stick sources unchanged
        run: bash scripts/verify-firestick-base.sh
      - name: Build the responsive Android port
        run: gradle :app:testDebugUnitTest :android:lintDebug :android:assembleDebug :android:assembleDebugAndroidTest --no-daemon
      - name: Verify Android package, signature and TV launcher
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/build/outputs/apk/debug/android-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/build/outputs/apk/debug/android-debug.apk | tee android-package.txt
          grep -q "name='pl.tvplayer.preview' versionCode='39' versionName='0.9.22-android'" android-package.txt
          grep -q "launchable-activity: name='pl.tvplayer.TvActivity'" android-package.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OKTV-Android-0.9.22
          retention-days: 5
          path: |
            android/build/outputs/apk/debug/android-debug.apk
            android/build/outputs/apk/androidTest/debug/android-debug-androidTest.apk
          if-no-files-found: error
  install-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: OKTV-Android-0.9.22, path: apk}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          ram-size: 2048M
          script: bash scripts/smoke-android-firestick.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: Android-FireStick-test-report, path: android-tv-smoke-output/, retention-days: 5}
  publish-apk:
    needs: install-smoke
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: OKTV-Android-0.9.22, path: apk}
      - name: Publish Android port while preserving the original TV package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          gh release download v0.9.16-tv-preview --pattern OKTV-Player-TV.apk --dir firestick-original
          echo '6e75e4949b117e135b35b3e5ac59133d766ebc364c5cb90cb0418634043e9e39  firestick-original/OKTV-Player-TV.apk' | sha256sum -c -
          cp apk/debug/android-debug.apk OKTV-Player-Android-0.9.22.apk
          sha256sum OKTV-Player-Android-0.9.22.apk > SHA256SUMS-Android.txt
          gh release create v0.9.22-android OKTV-Player-Android-0.9.22.apk SHA256SUMS-Android.txt --target "$SOURCE_SHA" --prerelease --latest=false --title "OKTV Player Android 0.9.22" --notes "Seriale M3U wybrane z ekranu głównego otwierają odcinki z pełnej biblioteki."
