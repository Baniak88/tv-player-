<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, initial-scale=1">
  <title>TV Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <header><div class="brand">TV PLAYER <span>SAMSUNG TV</span></div><time id="clock"></time></header>
    <section id="screen" aria-live="polite"></section>
    <footer><span id="status">Wczytywanie biblioteki…</span><span>Strzałki · OK wybierz · Wstecz powrót</span></footer>
  </main>
  <section id="player" hidden aria-label="Odtwarzacz">
    <object id="av-player" type="application/avplayer"></object>
    <video id="html-player" playsinline></video>
    <div id="player-controls"><h2 id="playing-title"></h2><p id="playback-status"></p><div class="player-actions">
      <button data-action="player-back">‹ Biblioteka</button><button data-action="rewind">−30 s</button><button data-action="pause">Pauza / odtwórz</button><button data-action="forward">+30 s</button><button data-action="player-guide">Program TV</button><button data-action="tracks">Audio / napisy</button>
    </div></div>
    <div id="subtitle" aria-live="off"></div>
  </section>
  <section id="modal" hidden role="dialog" aria-modal="true"><div id="dialog"></div></section>
  <script src="$WEBAPIS/webapis/webapis.js"></script>
  <script src="core.js"></script>
  <script src="storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
