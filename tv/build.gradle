plugins { id 'com.android.application' }
android {
    namespace 'pl.tvplayer'
    sourceSets { androidTest { java.srcDirs += [rootProject.file("app/src/androidTestSeries/java")]; assets.srcDirs += [rootProject.file("app/src/androidTest/assets")] } }
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'pl.tvplayer.television'
        minSdk 25
        targetSdk 35
        versionCode 4
        versionName '0.9.3-preview'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        preview {
            storeFile rootProject.file('signing/preview.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes { debug { signingConfig signingConfigs.preview } }
    sourceSets {
        main {
            java.srcDirs = ['src/main/java', '../app/src/main/java']
            res.srcDirs = ['src/main/res', '../app/src/main/res']
        }
    }
    compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'com.google.zxing:core:3.5.3'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
